name: Deploy to Firebase Hosting

on:
  push:
    branches: [ main, master ]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4 # Updated to v4

      - name: Use Node.js
        uses: actions/setup-node@v4 # Updated to v4
        with:
          node-version: '20'
          cache: 'yarn' # This makes your builds faster
          
      - name: Enable Corepack
        run: corepack enable # Modern way to use Yarn on Node 20
        
      - name: Install Dependencies
        run: yarn install --frozen-lockfile
        
      - name: Build Web App
        run: npx expo export -p web # This creates a 'dist' folder
        
      - name: Deploy to Firebase
        run: npx firebase-tools deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}" --project masterclass-dz